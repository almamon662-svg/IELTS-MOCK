<script>

/* =========================

/* =========================
PDF IMPORT
========================= */

async function importPDF(e){

const file=e.target.files[0];

if(!file)return;

document
.getElementById("progressArea")
.classList.remove("hidden");

setProgress(2,"Opening PDF...");

try{

const buffer=await file.arrayBuffer();

const pdf=await pdfjsLib
.getDocument({data:buffer})
.promise;

let pages=[];

for(let i=1;i<=pdf.numPages;i++){

setProgress(
Math.round((i/pdf.numPages)*70),
`Processing page ${i} of ${pdf.numPages}`
);

const page=await pdf.getPage(i);

const textContent=
await page.getTextContent();

let text=textContent.items
.map(x=>x.str)
.join(" ")
.trim();

/*
If PDF is scanned/image based,
normal text extraction will be almost empty.
Then OCR is automatically used.
*/

if(text.length<40){

setProgress(
Math.round((i/pdf.numPages)*70),
`OCR scanning page ${i} of ${pdf.numPages}`
);

text=await OCR(page);

}

pages.push({
page:i,
text:text
});

}

setProgress(80,"Detecting Cambridge structure...");

const allText=
pages.map(x=>x.text).join("\n\n");

const bookNumber=
detectBookNumber(allText);

const bookName=
bookNumber
?`Cambridge IELTS ${bookNumber}`
:file.name.replace(".pdf","");

setProgress(84,"Creating book...");

const bookInsert=
await db
.from("books")
.insert({
name:bookName,
book_number:bookNumber||null,
status:"draft"
})
.select()
.single();

if(bookInsert.error)
throw bookInsert.error;

currentBook=bookInsert.data;

for(let testNumber=1;testNumber<=4;testNumber++){

setProgress(
85+testNumber*3,
`Creating Test ${testNumber}...`
);

const test=
await db
.from("tests")
.insert({
book_id:currentBook.id,
test_number:testNumber
})
.select()
.single();

if(test.error)
throw test.error;

const testPages=
detectTestPages(
pages,
testNumber
);

for(const moduleName of
["Listening","Reading","Writing","Speaking"]){

const moduleText=
detectModuleText(
testPages,
moduleName
);

const module=
await db
.from("modules")
.insert({
test_id:test.data.id,
module:moduleName,
content:moduleText,
published:false
})
.select()
.single();

if(module.error)
throw module.error;

/*
Create editable questions.
*/

const questions=
parseQuestions(
moduleText,
moduleName
);

if(questions.length){

const rows=
questions.map((q,index)=>({

module_id:module.data.id,
question_number:index+1,
question_type:q.type,
question_text:q.text,
options:q.options||[],
correct_answer:"",
explanation:"",
marks:1,
published:false

}));

const insertQuestions=
await db
.from("questions")
.insert(rows);

if(insertQuestions.error)
throw insertQuestions.error;

}

}

}

setProgress(100,"Import completed.");

document.getElementById("importResult").innerHTML=`

<div class="card">

<h2>✅ Import Complete</h2>

<p>
${escapeHTML(bookName)} successfully created.
</p>

<p>
Tests 1–4 and all four modules have been created.
</p>

<button
class="btn primary"
onclick="page('content',
document.querySelectorAll('.nav')[2])">

Open Tests & Modules

</button>

</div>

`;

loadStats();

}catch(err){

console.error(err);

document.getElementById("importResult").innerHTML=`

<div class="card">

<h2>❌ Import Error</h2>

<p>${escapeHTML(err.message)}</p>

</div>

`;

}

}


/* =========================
OCR
========================= */

async function OCR(page){

const viewport=
page.getViewport({
scale:1.8
});

const canvas=
document.createElement("canvas");

canvas.width=viewport.width;
canvas.height=viewport.height;

const ctx=canvas.getContext("2d");

await page.render({
canvasContext:ctx,
viewport
}).promise;

const result=
await Tesseract.recognize(
canvas,
"eng",
{
logger:m=>console.log(m)
}
);

return result.data.text||"";

}


/* =========================
BOOK NUMBER
========================= */

function detectBookNumber(text){

const patterns=[
/Cambridge\s+IELTS\s+(\d+)/i,
/IELTS\s+(\d+)/i
];

for(const p of patterns){

const m=text.match(p);

if(m)return parseInt(m[1]);

}

return null;

}


/* =========================
TEST DETECTION
========================= */

function detectTestPages(pages,testNumber){

const starts=[];

pages.forEach((p,index)=>{

const t=p.text.toLowerCase();

if(
t.includes(`test ${testNumber}`) ||
t.includes(`test${testNumber}`)
){
starts.push(index);
}

});

if(!starts.length){

const size=
Math.ceil(pages.length/4);

const start=
(testNumber-1)*size;

return pages.slice(
start,
testNumber===4
?pages.length
:testNumber*size
);

}

const start=starts[0];

let end=pages.length;

for(let i=start+1;i<pages.length;i++){

const t=pages[i].text.toLowerCase();

if(
t.includes(`test ${testNumber+1}`) ||
t.includes(`test${testNumber+1}`)
){

end=i;
break;

}

}

return pages.slice(start,end);

}


/* =========================
MODULE DETECTION
========================= */

function detectModuleText(pages,module){

const keywords={
Listening:[
"listening test",
"listening",
"section 1"
],
Reading:[
"reading test",
"reading passage",
"reading"
],
Writing:[
"writing task 1",
"writing task 2",
"writing test"
],
Speaking:[
"speaking test",
"speaking part 1",
"speaking part 2"
]
};

const all=
pages.map(x=>x.text).join("\n\n");

const lower=all.toLowerCase();

let positions=[];

keywords[module].forEach(k=>{

let pos=lower.indexOf(k);

if(pos>=0)
positions.push(pos);

});

if(!positions.length)return "";

positions.sort((a,b)=>a-b);

const start=
Math.max(0,positions[0]-500);

return all.substring(
start,
Math.min(
all.length,
start+30000
)
);

}


/* =========================
QUESTION PARSER
========================= */

function parseQuestions(text,module){

if(!text)return[];

const lines=
text
.split(/\n+/)
.map(x=>x.trim())
.filter(Boolean);

const result=[];

let current=null;

for(const line of lines){

/*
Examples:
1.
1)
Question 1
Question 1:
*/

const match=
line.match(
/^(?:Question\s*)?(\d{1,2})[\.\):\-]\s*(.*)$/i
);

if(match){

if(current)
result.push(current);

current={
number:parseInt(match[1]),
text:match[2],
options:[]
};

continue;

}

if(current){

const option=
line.match(
/^([A-H])[\.\):\-]\s*(.*)$/i
);

if(option){

current.options.push({
label:option[1].toUpperCase(),
text:option[2]
});

}else{

current.text+=
" "+line;

}

}

}

if(current)
result.push(current);

return result.slice(0,100);

}

========================= */

.select("id",{count:"exact",head:true})
.eq("module_id",moduleId);

const next=
(count.count||0)+1;

const result=
await db
.from("questions")
.insert({
module_id:moduleId,
question_number:next,
question_text:"",
question_type:"text",
options:[],
published:false
});

if(result.error)
alert(result.error.message);
else

}

DELETE
========================= */

const result=
await db

.delete()
.eq("id",id);

/* =========================
PUBLISH BOOK
========================= */

async function publishBook(id){

const result=
await db
.from("books")
.update({
status:"published"
})
.eq("id",id);

if(result.error){

alert(result.error.message);
return;

}

/*
Publish all tests/modules/questions
belonging to the book.
*/

const tests=
await db
.from("tests")
.select("id")
.eq("book_id",id);

for(const test of tests.data||[]){

await db
.from("modules")
.update({published:true})
.eq("test_id",test.id);

const modules=
await db
.from("modules")
.select("id")
.eq("test_id",test.id);

for(const m of modules.data||[]){

await db
.from("questions")
.update({published:true})
.eq("module_id",m.id);

}

}

alert("Book published successfully.");

loadBooks();

}

/* =========================

========================= */

function setProgress(n,text){

document.getElementById("progressBar")
.style.width=n+"%";

document.getElementById("progressStatus")
.textContent=text;

}


/* =========================
SAFE HTML
========================= */

function escapeHTML(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttr(v){

return escapeHTML(v);

}


/* =========================
START
========================= */

loadStats();
