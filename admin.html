<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IELTS ZONE | Admin Dashboard</title>

<style>
:root{
    --primary:#4f46e5;
    --primary-dark:#3730a3;
    --dark:#111827;
    --text:#1f2937;
    --muted:#6b7280;
    --bg:#f4f7fb;
    --white:#ffffff;
    --border:#e5e7eb;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#d97706;
    --shadow:0 15px 40px rgba(15,23,42,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea{
    font:inherit;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        radial-gradient(circle at top left,#6366f1 0%,transparent 35%),
        radial-gradient(circle at bottom right,#818cf8 0%,transparent 30%),
        #111827;
}

.login-card{
    width:100%;
    max-width:430px;
    background:white;
    padding:42px;
    border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.brand{
    text-align:center;
    margin-bottom:32px;
}

.brand-logo{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    font-size:30px;
    font-weight:800;
    box-shadow:0 12px 25px rgba(79,70,229,.3);
}

.brand h1{
    font-size:25px;
    color:#111827;
}

.brand h1 span{
    color:var(--primary);
}

.brand p{
    margin-top:7px;
    color:var(--muted);
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
    color:#374151;
}

input,textarea{
    width:100%;
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:11px;
    padding:13px 14px;
    outline:none;
    transition:.2s;
}

input:focus,textarea:focus{
    border-color:var(--primary);
    background:white;
    box-shadow:0 0 0 4px rgba(79,70,229,.08);
}

textarea{
    min-height:105px;
    resize:vertical;
}

.btn{
    border:none;
    border-radius:11px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
}

.btn-primary{
    width:100%;
    background:linear-gradient(135deg,#4f46e5,#6366f1);
    color:white;
    box-shadow:0 8px 20px rgba(79,70,229,.25);
}

.btn-primary:hover{
    transform:translateY(-1px);
    box-shadow:0 12px 25px rgba(79,70,229,.3);
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:#111827;
    color:white;
    padding:25px 16px;
    z-index:10;
}

.sidebar-brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 10px 30px;
}

.sidebar-logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.sidebar-brand strong{
    font-size:17px;
}

.sidebar-brand span{
    color:#818cf8;
}

.menu-title{
    font-size:10px;
    color:#6b7280;
    text-transform:uppercase;
    letter-spacing:1.5px;
    padding:10px;
    margin-top:10px;
}

.menu-item{
    width:100%;
    border:none;
    background:transparent;
    color:#cbd5e1;
    padding:13px 12px;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    text-align:left;
    margin:4px 0;
}

.menu-item:hover,
.menu-item.active{
    background:#1f2937;
    color:white;
}

.logout-btn{
    position:absolute;
    left:16px;
    right:16px;
    bottom:20px;
    background:#1f2937;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:245px;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.topbar h2{
    font-size:27px;
}

.topbar p{
    color:var(--muted);
    margin-top:5px;
    font-size:14px;
}

.admin-user{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    padding:8px 14px;
    border-radius:12px;
    box-shadow:var(--shadow);
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#e0e7ff;
    color:#4338ca;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

/* =========================
   STATISTICS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:22px;
    border-radius:17px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.stat-info small{
    color:var(--muted);
    font-size:13px;
}

.stat-info h3{
    font-size:28px;
    margin-top:7px;
}

.stat-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#eef2ff;
    color:#4f46e5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

/* =========================
   CONTENT GRID
========================= */

.content-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:22px;
}

.card{
    background:white;
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:24px;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.card-header h3{
    font-size:18px;
}

.card-header p{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.add-btn{
    background:var(--primary);
    color:white;
}

.cancel-btn{
    background:#f3f4f6;
    color:#374151;
    margin-left:7px;
}

/* =========================
   VOCABULARY
========================= */

.search-box{
    margin-bottom:18px;
}

.vocabulary-list{
    max-height:650px;
    overflow-y:auto;
    padding-right:5px;
}

.word-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:12px;
    transition:.2s;
}

.word-card:hover{
    border-color:#c7d2fe;
    box-shadow:0 7px 20px rgba(79,70,229,.07);
}

.word-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.word-top h4{
    font-size:18px;
}

.status{
    font-size:10px;
    font-weight:800;
    padding:5px 8px;
    border-radius:20px;
}

.status.published{
    background:#dcfce7;
    color:#15803d;
}

.status.draft{
    background:#fef3c7;
    color:#b45309;
}

.word-meaning{
    margin-top:9px;
    font-size:14px;
}

.word-example{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
}

.word-synonyms{
    margin-top:8px;
    font-size:12px;
    color:#4f46e5;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.action-btn{
    padding:7px 10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.publish{
    background:#ecfdf5;
    color:#15803d;
}

.unpublish{
    background:#fff7ed;
    color:#c2410c;
}

.delete{
    background:#fef2f2;
    color:#dc2626;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#111827;
    color:white;
    padding:14px 18px;
    border-radius:11px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:100;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .sidebar{
        width:70px;
        padding:20px 10px;
    }

    .sidebar-brand strong,
    .menu-title,
    .menu-item span{
        display:none;
    }

    .sidebar-brand{
        justify-content:center;
        padding-bottom:25px;
    }

    .menu-item{
        justify-content:center;
    }

    .logout-btn{
        font-size:0;
    }

    .logout-btn:first-letter{
        font-size:16px;
    }

    .main{
        margin-left:70px;
        padding:20px;
    }

    .content-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .main{
        padding:14px;
    }

    .topbar{
        align-items:flex-start;
    }

    .topbar h2{
        font-size:22px;
    }

    .admin-user{
        display:none;
    }

    .card{
        padding:17px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page" id="loginPage">

    <div class="login-card">

        <div class="brand">

            <div class="brand-logo">
                I
            </div>

            <h1>IELTS <span>ZONE</span></h1>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard" id="dashboard">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="sidebar-logo">
                I
            </div>

            <strong>
                IELTS <span>ZONE</span>
            </strong>

        </div>

        <div class="menu-title">
            Management
        </div>

        <button class="menu-item active">
            <span>📊</span>
            <span>Dashboard</span>
        </button>

        <button class="menu-item">
            <span>📚</span>
            <span>Vocabulary</span>
        </button>

        <button class="menu-item">
            <span>📝</span>
            <span>Mock Tests</span>
        </button>

        <div class="menu-title">
            Coming Soon
        </div>

        <button class="menu-item">
            <span>🎧</span>
            <span>Listening</span>
        </button>

        <button class="menu-item">
            <span>📖</span>
            <span>Reading</span>
        </button>

        <button class="menu-item">
            <span>✍️</span>

    <main class="main">

        <!-- STATISTICS -->

        <div class="stats">

                <div class="stat-info">

                    <small>Total Vocabulary</small>

                    <h3 id="totalWords">

                <div class="stat-info">

                    <h3 id="publishedWords">

                    </h3>

                </div>

                    </h3>

        <!-- CONTENT -->

        <div class="content-grid">


            <!-- ADD FORM -->

            <div class="card">

                            Create a new IELTS word
                        </p>

                    </div>

                </div>


                <div class="form-group">

                    <label>Word *</label>

                    <input
                        id="word"

                <div class="form-group">

                    <label>Meaning *</label>

                    <textarea
                        id="meaning"

                    ></textarea>

                <div class="form-group">

                    <label>Example Sentence</label>

                    <textarea

                    ></textarea>

                </div>

                    <label>Synonyms</label>

                    <input
                        id="synonyms"

                        placeholder="e.g. Plentiful, Ample"

                <button

                        id="search"
                        placeholder="🔎 Search vocabulary..."
                        oninput="filterVocabulary()"

                <div
                    class="vocabulary-list"
                    id="vocabularyList"

<div class="toast" id="toast"></div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION

   IMPORTANT:
   Replace ONLY these two values.

   Do NOT use the Supabase Secret Key.
===================================================== */

const SUPABASE_URL =
"https://emdhibdfjtgygtuffzkc.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_wjDEfOiEPB7Asyn2bOLNgQ_xx-Ohwpf";


let accessToken = "";
let vocabularyData = [];


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.textContent =
            "Please enter your email and password.";

        message.style.color =
            "#dc2626";

        return;
    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method:"POST",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            message.textContent =
                data.error_description ||
                data.msg ||
                "Login failed.";

            message.style.color =
                "#dc2626";

            return;
        }


        accessToken =
            data.access_token;


        document
            .getElementById("loginPage")
            .style.display="none";


        document
            .getElementById("dashboard")
            .style.display="block";


        document
            .getElementById("adminEmail")
            .textContent=email;


        await loadVocabulary();


    }catch(error){

        message.textContent =
            "Connection error. Please check your Supabase settings.";

        message.style.color =
            "#dc2626";
    }
}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    accessToken="";

    document
        .getElementById("dashboard")
        .style.display="none";

    document
        .getElementById("loginPage")
        .style.display="flex";

    document
        .getElementById("loginPassword")
        .value="";
}


/* =====================================================
   ADD VOCABULARY
===================================================== */

async function addVocabulary(){

    const word =
        document.getElementById("word")
        .value.trim();

    const meaning =
        document.getElementById("meaning")
        .value.trim();

    const example =
        document.getElementById("example")
        .value.trim();

    const synonyms =
        document.getElementById("synonyms")
        .value.trim();


    if(!word || !meaning){

        showToast(
            "Word and meaning are required."
        );

        return;
    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/vocabulary",
                {
                    method:"POST",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken,
                        "Content-Type":
                            "application/json",
                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({
                        word:word,
                        meaning:meaning,
                        example:example,
                        synonyms:synonyms,
                        published:false
                    })
                }
            );


        if(!response.ok){

            const error =
                await response.json();

            showToast(
                error.message ||
                "Could not add vocabulary."
            );

            return;
        }


        document
            .getElementById("word")
            .value="";

        document
            .getElementById("meaning")
            .value="";

        document
            .getElementById("example")
            .value="";

        document
            .getElementById("synonyms")
            .value="";


        showToast(
            "Vocabulary added successfully!"
        );


        await loadVocabulary();


    }catch(error){

        showToast(
            "Connection error."
        );
    }
}


/* =====================================================
   LOAD VOCABULARY
===================================================== */

async function loadVocabulary(){

    const list =
        document.getElementById("vocabularyList");


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/vocabulary?select=*&order=created_at.desc",
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );


        if(!response.ok){

            list.innerHTML =
                "<p>Could not load vocabulary.</p>";

            return;
        }


        vocabularyData =
            await response.json();


        updateStats();

        renderVocabulary(
            vocabularyData
        );


    }catch(error){

        list.innerHTML =
            "<p>Connection error.</p>";
    }
}


/* =====================================================
   RENDER VOCABULARY
===================================================== */

function renderVocabulary(words){

    const list =
        document.getElementById("vocabularyList");


    if(!words.length){

        list.innerHTML=`
            <div style="
                text-align:center;
                padding:45px 10px;
                color:#6b7280;
            ">
                <div style="font-size:35px;">
                    📚
                </div>

                <p style="margin-top:10px;">
                    No vocabulary found.
                </p>
            </div>
        `;

        return;
    }


    list.innerHTML="";


    words.forEach(function(item){

        const card =
            document.createElement("div");

        card.className="word-card";


        card.innerHTML=`

            <div class="word-top">

                <h4>
                    ${escapeHtml(item.word)}
                </h4>

                <span class="status ${
                    item.published
                    ? "published"
                    : "draft"
                }">

                    ${
                        item.published
                        ? "PUBLISHED"
                        : "DRAFT"
                    }

                </span>

            </div>


            <div class="word-meaning">

                <strong>Meaning:</strong>
                ${escapeHtml(item.meaning)}

            </div>


            ${
                item.example
                ? `
                <div class="word-example">
                    <strong>Example:</strong>
                    ${escapeHtml(item.example)}
                </div>
                `
                : ""
            }


            ${
                item.synonyms
                ? `
                <div class="word-synonyms">
                    <strong>Synonyms:</strong>
                    ${escapeHtml(item.synonyms)}
                </div>
                `
                : ""
            }


            <div class="actions">

                <button
                    class="action-btn ${
                        item.published
                        ? "unpublish"
                        : "publish"
                    }"
                    onclick="
                        togglePublish(
                            '${item.id}',
                            ${item.published}
                        )
                    "
                >

                    ${
                        item.published
                        ? "Unpublish"
                        : "Publish"
                    }

                </button>


                <button
                    class="action-btn delete"
                    onclick="
                        deleteVocabulary(
                            '${item.id}'
                        )
                    "
                >
                    Delete
                </button>

            </div>

        `;


        list.appendChild(card);

    });
}


/* =====================================================
   SEARCH
===================================================== */

function filterVocabulary(){

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        vocabularyData.filter(function(item){

            return (
                (item.word || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (item.meaning || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (item.synonyms || "")
                    .toLowerCase()
                    .includes(search)
            );
        });


    renderVocabulary(filtered);
}


/* =====================================================
   PUBLISH / UNPUBLISH
===================================================== */

async function togglePublish(
    id,
    currentStatus
){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/vocabulary?id=eq." +
                encodeURIComponent(id),
                {
                    method:"PATCH",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken,
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        published:!currentStatus
                    })
                }
            );


        if(!response.ok){

            showToast(
                "Could not update status."
            );

            return;
        }


        showToast(
            currentStatus
            ? "Vocabulary unpublished."
            : "Vocabulary published!"
        );


        await loadVocabulary();


    }catch(error){

        showToast(
            "Connection error."
        );
    }
}


/* =====================================================
   DELETE
===================================================== */

async function deleteVocabulary(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this vocabulary?"
        );


    if(!confirmed) return;


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/vocabulary?id=eq." +
                encodeURIComponent(id),
                {
                    method:"DELETE",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );


        if(!response.ok){

            showToast(
                "Could not delete vocabulary."
            );

            return;
        }


        showToast(
            "Vocabulary deleted."
        );


        await loadVocabulary();


    }catch(error){

        showToast(
            "Connection error."
        );
    }
}


/* =====================================================
   STATISTICS
===================================================== */

function updateStats(){

    const total =
        vocabularyData.length;

    const published =
        vocabularyData.filter(
            item => item.published
        ).length;

    const drafts =
        total - published;


    document
        .getElementById("totalWords")
        .textContent=total;

    document
        .getElementById("publishedWords")
        .textContent=published;

    document
        .getElementById("draftWords")
        .textContent=drafts;
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent=message;

    toast.classList.add("show");


    setTimeout(function(){

        toast.classList.remove("show");

    },3000);
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
