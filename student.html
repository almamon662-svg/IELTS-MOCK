<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Mock Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f7fb;
color:#172033
}
header{
background:#fff;
padding:20px 30px;
border-bottom:1px solid #ddd
}
.container{
max-width:1100px;
margin:auto;
padding:30px
}
.card{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:20px
}
button{
padding:12px 18px;
border:0;
border-radius:8px;
background:#3157d5;
color:white;
font-weight:bold;
cursor:pointer
}
.question{
background:white;
padding:20px;
border-radius:12px;
margin:15px 0
}
.option{
display:block;
padding:10px;
margin:7px 0;
background:#f2f4f8;
border-radius:7px
}
.timer{
position:sticky;
top:0;
background:#111827;
color:white;
padding:15px;
text-align:center;
font-size:20px
}
.correct{background:#dff5e6}
.wrong{background:#ffe1e1}
</style>
</head>

<body>

<header>
<h2>IELTSZONE</h2>
</header>

<div class="container">

<div id="books"></div>

<div id="test" style="display:none">

<div class="timer" id="timer">
60:00
</div>

<div id="questions"></div>

<button onclick="submitTest()">
Submit Test
</button>

</div>

<div id="result"></div>

</div>


<script>

const SUPABASE_URL =
"https://emdhibdfjtgygtuffzkc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wjDEfOiEPB7Asyn2bOLNgQ_xx-Ohwpf";

const db=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentTest=null;
let questions=[];
let answers={};
let seconds=3600;
let timer=null;


/* =========================
LOAD BOOKS
========================= */

async function loadBooks(){

const {data,error}=
await db
.from("books")
.select(`
*,
tests(*)
`)
.eq("status","published");

if(error){

document.getElementById("books")
.innerHTML=error.message;

return;

}

document.getElementById("books")
.innerHTML=`

<div class="card">

<h1>IELTS Mock Tests</h1>

${data.map(book=>`

<h2>${escapeHTML(book.name)}</h2>

${book.tests.map(test=>`

<button
onclick="startTest('${test.id}')">

Test ${test.test_number}

</button>

`).join(" ")}

<hr>

`).join("")}

</div>

`;

}


/* =========================
START TEST
========================= */

async function startTest(testId){

currentTest=testId;

const {data,error}=
await db
.from("modules")
.select(`
*,
questions(*)
`)
.eq("test_id",testId)
.eq("published",true);

if(error){

alert(error.message);
return;

}

questions=[];

for(const module of data){

for(const q of module.questions){

questions.push({
...q,
module:module.module
});

}

}

questions.sort(
(a,b)=>a.question_number-b.question_number
);

document.getElementById("books")
.style.display="none";

document.getElementById("test")
.style.display="block";

renderQuestions();

startTimer();

}


/* =========================
QUESTIONS
========================= */

function renderQuestions(){

const box=
document.getElementById("questions");

box.innerHTML="";

questions.forEach((q,index)=>{

let html=`

<div class="question">

<h3>
${index+1}. ${escapeHTML(q.question_text)}
</h3>

`;

const opts=q.options||[];

if(opts.length){

opts.forEach((o,i)=>{

html+=`

<label class="option">

<input
type="radio"
name="q${q.id}"
value="${escapeAttr(o.label||o.text)}"
onchange="answers['${q.id}']=this.value">

${escapeHTML(o.label||"")}
${escapeHTML(o.text||"")}

</label>

`;

});

}else{

html+=`

<input
style="width:100%;padding:12px"
placeholder="Your answer"
oninput="answers['${q.id}']=this.value">

`;

}

html+=`</div>`;

box.innerHTML+=html;

});

}


/* =========================
TIMER
========================= */

function startTimer(){

timer=setInterval(()=>{

seconds--;

let min=
Math.floor(seconds/60);

let sec=
seconds%60;

document.getElementById("timer")
.textContent=
`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

if(seconds<=0){

clearInterval(timer);

submitTest();

}

},1000);

}


/* =========================
SUBMIT
========================= */

async function submitTest(){

clearInterval(timer);

let score=0;

questions.forEach(q=>{

const user=
String(answers[q.id]||"")
.trim()
.toLowerCase();

const correct=
String(q.correct_answer||"")
.trim()
.toLowerCase();

if(correct && user===correct){

score++;

}

});

const total=
questions.filter(q=>q.correct_answer).length;

const percentage=
total
?Math.round(score/total*100)
:0;

await db
.from("attempts")
.insert({
test_id:currentTest,
score,
total,
percentage,
answers
});

document.getElementById("test")
.style.display="none";

document.getElementById("result")
.innerHTML=`

<div class="card">

<h1>Test Result</h1>

<h2>
Score: ${score}/${total}
</h2>

<h2>
${percentage}%
</h2>

<p>
Your answers have been saved.
</p>

<button onclick="location.reload()">
Try Again
</button>

</div>

`;

}


/* =========================
SAFE
========================= */

function escapeHTML(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttr(v){
return escapeHTML(v);
}

loadBooks();

</script>

</body>
</html>
